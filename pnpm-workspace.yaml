packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

# pnpm по умолчанию не запускает install-скрипты зависимостей. Разрешаем явно.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: false
  '@scarf/scarf': false
  sharp: false
  unrs-resolver: false
