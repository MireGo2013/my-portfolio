# Весь проект одной командой: docker compose up --build
# Сайт: http://localhost:3000, API: http://localhost:3001/api/docs
#
# Только для локальной разработки: логин и пароль здесь не секрет,
# а порты доступны лишь с этой машины. Настройки прода живут на хостинге.

x-database-url: &database-url postgresql://portfolio:portfolio@db:5432/portfolio

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

  # Применяет миграции и заполняет контент, затем завершается
  migrate:
    build:
      context: .
      target: api
    command: ['node', '--run', 'db:release']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    # Отсюда приезжают настройки Telegram, если они есть
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: *database-url
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      # Только для локального запуска. В проде секрет задаётся на хостинге
      JWT_SECRET: local-docker-secret-not-for-production-use
      ADMIN_EMAIL: admin@localhost.dev
      ADMIN_PASSWORD: local-admin-password
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: web
    environment:
      # Сервер Next.js ходит к API внутри сети Docker
      API_URL: http://api:3001
      # А браузер пользователя находится снаружи и использует опубликованный порт
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      # Сборка идёт при старте контейнера
      start_period: 5m
      start_interval: 3s

volumes:
  db-data:
